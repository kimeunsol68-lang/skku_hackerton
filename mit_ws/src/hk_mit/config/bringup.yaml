# MIT 기본 코드 노드 설정. 비운 파일 경로는 이 패키지 course/의 파일(route.csv, course.json)을 씁니다.
hk_mit_localization:
  ros__parameters:
    course_json: ""               # 출발·복귀 자세와 지도 원점
hk_mit_planner:
  ros__parameters:
    ahead_m: 45.0                 # minimum preview, extended for stopping distance
    behind_m: 2.0                 # 차 뒤로 남길 경로 길이 (m)
    route_csv: ""                 # 전역 경로 (0.5 m 간격)
    missions_enabled: true        # false: 미션 모듈(주차·장애물·로터리)을 부르지 않고 기본 경로만 따라감
    obstacle3_speed: 0.0          # team profile excludes obstacle3
    obstacle3_lead_m: 12.0        # obstacle3 구역 입구 이만큼(m) 앞부터 위 속도로 달림
    odom_timeout_s: 0.30
    scan_timeout_s: 0.35
    diagnostic_period_s: 1.0
    park_v_reverse: 2.0      # 잔걸음 대신 또렷한 S커브 후진 (1.2 -> 2.0)
    park_v_reverse_fast: 2.2  # straight portions only
    park_v_adjust: 1.4       # 보정·탈출 속력 (0.5 -> 1.4)
    park_v_exit: 2.0         # 3.0 swung across the lane into the far wall leaving the slot (seed 6, GNSS error 0.6 m)
    park_decel: 1.8          # 접근 감속 계획 (1.0 -> 1.8): 접근 구간 단축
    rpark_v_enter_fast: 8.0  # 후면주차 진입 직선 (5.0 -> 8.0, cp9 앞 플래너 상한도 8.0). 호 구간은 rpark_v_enter
    rpark_a_dec: 3.0         # 후면주차 호 앞 감속 계획 (2.0 -> 3.0: 직선 고속 구간 연장)
    rpark_v_enter: 3.4       # 진입 호 3.0 -> 3.4 (진입 두 번째 회전을 0.4 m 일찍 시작해 동쪽 벽 여유 확보)
    rpark_v_exit: 3.4        # 탈출 호 3.0 -> 3.4
    rpark_v_exit_fast: 8.0   # 후면주차 탈출 직선 (6.0 -> 8.0)
    park_phase_timeout_s: 9.0   # 후진/전진 등 한 phase 최대 시간 (s). 정상 후진(~7 s)은 끊지 않음
    park_total_timeout_s: 22.0  # 전체 주차 시도 최대 시간 (s). 넘으면 멈춘 자리에서 완료 처리
    park_hold_s: 3.1         # required 3 s stop
    park_delay: 0.25         # effective delay follows actual option
    rpark_delay: 0.25
    park_debug: 0.0          # 주차 중 20 Hz 파일 기록 끔 (제어 지연 방지)
    park_slot_x: -18.3347    # 평행주차 목표를 칸 중심(-18.1147)보다 0.22 m 안쪽(벽 쪽)으로: GNSS 오차 0.3 m + 8도 기울기로
                             # 도로 쪽 앞 모서리가 칸 밖 0.1 m에 서서 실패한 기록(seed 0). 벽 쪽 여유는 0.5 m 남음
hk_mit_control:
  ros__parameters:
    # --- 속도 프로파일 (곡률 기반). 주의: launch의 target_speed 인자는 프로파일을 쓰는 동안 무시됩니다 ---
    profile_enabled: 1.0          # 1: 곡률 기반 속도 프로파일, 0: target_speed 하나로 (예전 방식)
    v_max: 13.0                   # 직선 최고 속도 (m/s) (12 -> 13: 긴 직선 구간만 영향)
    v_min: 4.5                    # compatibility only; never overrides curvature limit
    a_lat_max: 3.0                # 3.5 put the front corner 0.05 m from the wall entering the cp7->cp8 R=15 bend at 7 m/s (seed 1111111)
    a_decel: 3.0                  # 코너 진입 전 미리 감속하는 세기 (m/s²). 작을수록 일찍 감속 (2.6 -> 3.0, μ=1.0 노면)
    curv_window_m: 3.0            # 곡률을 잴 때 앞뒤로 보는 길이 (m)
    brake_ff_decel: 4.0           # 앞먹임 제동: brake=1일 때 감속 추정 (m/s²). 0이면 끔
    brake_ff_lookahead_s: 0.8     # 앞먹임 제동이 내다보는 시간 (s)
    speed_lead_s: 0.115            # auto: drive latency + 0.04 s
    auto_latency: 1.0
    odom_timeout_s: 0.30
    path_timeout_s: 0.35
    diagnostic_period_s: 1.0
    target_speed: 5.0             # 프로파일을 끌 때(profile_enabled: 0)만 쓰는 목표 속력 (m/s)
    # --- 저마찰 구간 (course.json의 low_friction zone 안에서만 적용) ---
    v_max_obstacle: 5.0           # = mission_obstacle SPEED_LIMIT: no hard brake when the avoidance path takes over
    obstacle_lead_m: 12.0         # 장애물 구역 입구 이만큼(m) 앞에서부터 v_max_obstacle로 달림
    lowmu_enabled: 1.0            # 1: 저마찰 구역 대응 켬, 0: 끔. 시뮬레이터 저마찰 옵션을 끄고 달릴 때는 0.0
    a_lat_lowmu: 1.3              # 1.6 slid wide into the wall on seed 1111111 (patch on the first R=8 S-bend); 1.3 = 66% of mu=0.2 limit
    v_min_lowmu: 2.3              # 이 구간의 최저 속도 (m/s)
    v_max_lowmu: 6.0              # 이 구간의 최고 속도 (m/s) (5.0 -> 6.0: 직선만 영향, 커브는 a_lat_lowmu가 제한)
    a_decel_lowmu: 1.3            # 이 구간의 감속 계획 (m/s²). 작을수록 일찍 감속 (1.0 -> 1.3, μ=0.2 한계 1.96의 66%)
    lowmu_brake_lead_m: 4.0       # 구역 앞 이만큼(m)부터만 저마찰 감속으로 계획. 그 앞 마른 노면에서는 a_decel(3.0)로 늦게 제동
    accel_max_lowmu: 0.4          # 이 구간의 구동 상한 (0~1). 0.3에서는 커브 목표 속도(3.5)에도 못 미쳤음(3.2) -> 0.4 (뒷바퀴 슬립 기록 보며 조정)
    brake_max_lowmu: 0.35         # 이 구간의 제동 상한 (0~1). 바퀴 잠김 방지
    steer_rate_lowmu: 6.0         # 이 구간의 조향 변화율 한계 (1/s). 사실상 제한 없음. 방향이 바뀔 때는 항상 즉시 추종
    lowmu_lead_m: 12.0            # 저마찰 구역 앞 이만큼(m)부터 저마찰 속도 한계 적용 (구역 경계 오차 대비)
    k_stanley_lowmu: 2.0          # 저마찰 구간 Stanley 옆오차 이득
    k_soft_lowmu: 0.3             # 저마찰 구간 Stanley 저속 완화값 (m/s). 작을수록 저속에서 적극적
    k_heading_lowmu: 1.0          # 저마찰 구간 방향 오차(전방 주시) 가중치
    # --- 경사 구간 (course.json의 slope zone 안에서만 적용) ---
    v_max_slope: 8.0              # 이 구간의 최고 속도 (m/s). 내리막 과속 방지
    a_lat_slope: 3.0          # extra corner margin in slope S bends (2.8 -> 3.0: R=7 m 헤어핀 4.4 -> 4.6 m/s. 벽 접촉 이력이 있어 소폭만)
    corner_hold_m: 8.0        # 급커브 앞 이 거리(m) 안에서는 그 커브 속도 + margin까지만 허용 (S커브 사이 직선 가속 방지)
    corner_hold_margin: 0.6
    corner_hold_vmax: 6.0
    slope_ki_mult: 2.0            # 이 구간의 적분 이득 배수 (오르막 처짐·내리막 과속을 빨리 보정)
    # --- 속력 PI 전환 / 조향 변화율 (구간 밖에서도) ---
    brake_on: 0.10                # 구동 -> 제동 전환 문턱 (PI 출력이 -brake_on 아래일 때)
    brake_off: 0.03               # 제동 -> 구동 복귀 문턱. brake_on보다 작게 둬야 경계에서 떨지 않음
    steer_rate_max: 8.0           # 조향 변화율 한계 (1/s). 사실상 제한 없음. 방향이 바뀔 때는 항상 즉시 추종
    # --- 좁은 도로 ---
    track_point_m: 2.6            # Stanley가 맞추는 점 (뒤차축에서 앞으로 m). 3.0 = 앞바퀴 축
    # --- 지연 보상: 시뮬레이터의 지연 옵션과 맞추세요 ---
    steer_delay_comp: 0.25        # 조향 지연 보상 (s). 조향 지연 옵션 켬(250 ms) -> 0.25, 끔 -> 0.0
    # --- 조향 (Stanley) / 속력 (PI) ---
    k_stanley: 1.0                # Stanley: 옆으로 벗어난 거리에 대한 조향 세기
    k_soft: 1.0                   # Stanley: 저속에서 조향이 너무 세지지 않게 (m/s)
    kp: 0.8                       # 속력 P 이득
    ki: 0.08                      # 속력 I 이득
    brake_gain: 0.6               # 너무 빠를 때 제동 세기
    override_timeout_s: 0.2       # 미션 직접 제어 명령이 이만큼(s) 안 오면 평소 제어로 복귀
